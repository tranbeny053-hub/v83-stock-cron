# Registered only when this file is directly under .github/workflows (an owner T3 renames it there unchanged); while it sits in ops/ng4_pilot/workflows/ GitHub never runs it.
name: NG4 pilot preflight (READ ONLY)

# DELIBERATELY NO automatic trigger. The authored file waits outside .github/workflows, which GitHub
# never registers; its script names the .github path the rename creates. Enabling renames the file
# unchanged and flips its dormancy tests (owner T3, git diff -M100%); dispatch is the owner's one-shot request.
# This is a production READ ONLY catalog preflight for the ucpe_lattice 0019 route, not a table audit.
#
# WHAT IT CHECKS. scripts/ng4_pilot_preflight.py starts with SET TRANSACTION READ ONLY, reads
# PostgreSQL catalog facts for the 0019 preconditions (server version, track_commit_timestamp,
# createrole_self_grant, role/membership safety, event triggers, parameter grants and ucpe_space_db),
# then rolls back. It reads no application rows and reports booleans/counts. The scratch rehearsal
# uses a local database and no production secret.
#
# TRUST BOUNDARY. Exact CPython 3.13.14, pinned Actions, bundled pip and lock-authenticated wheelhouse;
# `python -I -S -B`; dispatch bound to this workflow, owner repository, main and expected_sha. Inputs
# enter shell commands only through env and double quotes; every step uses bash. The protected
# Environment is production-db-owner. Only the production read step receives the database secret.
#
# CONCURRENCY. The section-5a-evaluation group serializes this route with the repository's protected
# database dispatch workflows.

"on":
  workflow_dispatch:
    inputs:
      expected_sha:
        description: REQUIRED. The full 40-character commit SHA on main that the owner reviewed
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: section-5a-evaluation
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    environment: production-db-owner  # C4: the owner URL lives only in this protected Environment
    timeout-minutes: 20
    steps:
      # Actions are pinned to full commit SHAs, never to movable tags.
      - name: Check out the dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: "false"

      - name: Install the exact pinned interpreter
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.13.14"
          check-latest: "false"

      - name: Install the hash-locked set with CPython's bundled pip, from authenticated wheels
        shell: bash
        # A literal block: `:all: ` in a plain YAML scalar would make the whole file invalid.
        run: |
          python -I -S -B scripts/evaluate_section_5a.py --remove-floating-installer
          bundled_pip="$(python -I -S -B scripts/evaluate_section_5a.py --bundled-pip)"
          python -I -S -B "$bundled_pip/pip" download --no-cache-dir --disable-pip-version-check \
            --require-hashes --no-deps --only-binary=:all: --dest "$RUNNER_TEMP/section-5a-wheels" \
            -r ops/section_5a_evaluator_requirements.lock
          python -I -S -B "$bundled_pip/pip" install --no-cache-dir --disable-pip-version-check \
            --no-index --find-links "$RUNNER_TEMP/section-5a-wheels" --no-compile \
            --require-hashes --no-deps --only-binary=:all: \
            -r ops/section_5a_evaluator_requirements.lock

      - name: Attest isolation, dispatch and runtime for this workflow (no database)
        shell: bash
        env:
          NG4_PILOT_PREFLIGHT_EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: python -I -S -B scripts/ng4_pilot_preflight.py --mode=attest --expected-sha="$NG4_PILOT_PREFLIGHT_EXPECTED_SHA" --wheelhouse="$RUNNER_TEMP/section-5a-wheels"

      - name: Rehearse preflight on scratch PostgreSQL (no secret)
        shell: bash
        env:
          NG4_PILOT_PREFLIGHT_REHEARSAL_URL: "postgresql:///ng4_pilot_preflight_rehearsal?host=/var/run/postgresql"
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -X -q -v ON_ERROR_STOP=1 -c "CREATE ROLE \"$(id -un)\" LOGIN CREATEROLE"
          sudo -u postgres createdb -O "$(id -un)" ng4_pilot_preflight_rehearsal
          python -I -S -B scripts/ng4_pilot_preflight.py --mode=rehearse --wheelhouse="$RUNNER_TEMP/section-5a-wheels" --report=ng4-pilot-preflight-rehearsal-report.json

      - name: Run preflight route tests (no secret)
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONNOUSERSITE: "1"
        run: python -s -B -m pytest -q -p no:cacheprovider tests/scripts/test_ng4_pilot_preflight.py tests/workflows/test_ng4_pilot_authored_workflows.py

      - name: Run the pilot preflight once, read only (the ONLY step that receives the database secret)
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          NG4_PILOT_PREFLIGHT_EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: python -I -S -B scripts/ng4_pilot_preflight.py --mode=run --expected-sha="$NG4_PILOT_PREFLIGHT_EXPECTED_SHA" --wheelhouse="$RUNNER_TEMP/section-5a-wheels" --report=ng4-pilot-preflight.json

      # The raw catalog rows and the assessment, on success and on refusal. Never the database URL.
      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: ng4-pilot-preflight
          path: |
            ng4-pilot-preflight.json
            ng4-pilot-preflight-rehearsal-report.json
          if-no-files-found: warn
