# AUTHORED BUT DISABLED. Enabling is only a pure rename into .github/workflows (owner T3, git diff -M100%); dispatch is the owner's one-shot authorization. The preflight is a production READ ONLY catalog query; this apply is T4 and must never be rerun.
name: NG4 pilot apply 0019 (AUTHORED BUT DISABLED, ONE SHOT)

# Dispatch-only. DELIBERATELY NO `schedule:`, `push:` OR `pull_request:` TRIGGER.
# - It checks the 0019 preconditions, applies the pinned migration and capacity bytes in one transaction,
#   then checks the catalog postconditions and outside-schema fingerprint. A second dispatch refuses.
# - Its pre-checks are the lattice route's own (the preflight's 0019 facts, including an empty
#   createrole_self_grant); nothing of migrations 0016-0018 is re-checked here.
#
# WHAT IT CHECKS. The route pins both migrations/authored/0019_lattice_evidence.sql and
# scripts/migration_0019_capacity.sql by digest. In one transaction it checks server 16+, absent
# ucpe_lattice schema and roles, the applier's CREATEROLE/non-superuser state, empty
# createrole_self_grant, and the preflight's catalog safety facts; then runs the two exact byte sets.
# Post-checks verify the lattice schema/roles, creator memberships, writer boundaries and that no
# unrelated catalog state changed. No application rows are read. A refusal rolls the transaction back.
#
# TRUST BOUNDARY. Exact CPython 3.13.14, pinned Actions, bundled pip and lock-authenticated
# wheelhouse; `python -I -S -B`; dispatch bound to this workflow, owner repository, main and expected_sha.
# Inputs enter shell commands only through env and double quotes; every step uses bash. The protected
# Environment is production-db-owner. Only the final database step receives the database secret.
#
# CONCURRENCY. The section-5a-evaluation group serializes this route with the repository's protected
# database dispatch workflows.

"on":
  workflow_dispatch:
    inputs:
      expected_sha:
        description: REQUIRED. The full 40-character commit SHA on main that the owner reviewed
        required: true
        type: string
      confirm:
        description: REQUIRED. Exactly APPLY-MIGRATION-0019-ONCE
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: section-5a-evaluation
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    environment: production-db-owner  # C4: the owner URL lives only in this protected Environment
    timeout-minutes: 20
    steps:
      # Actions are pinned to full commit SHAs, never to movable tags.
      - name: Check out the dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: "false"

      - name: Install the exact pinned interpreter
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.13.14"
          check-latest: "false"

      - name: Install the hash-locked set with CPython's bundled pip, from authenticated wheels
        shell: bash
        # A literal block: `:all: ` in a plain YAML scalar would make the whole file invalid.
        run: |
          python -I -S -B scripts/evaluate_section_5a.py --remove-floating-installer
          bundled_pip="$(python -I -S -B scripts/evaluate_section_5a.py --bundled-pip)"
          python -I -S -B "$bundled_pip/pip" download --no-cache-dir --disable-pip-version-check \
            --require-hashes --no-deps --only-binary=:all: --dest "$RUNNER_TEMP/section-5a-wheels" \
            -r ops/section_5a_evaluator_requirements.lock
          python -I -S -B "$bundled_pip/pip" install --no-cache-dir --disable-pip-version-check \
            --no-index --find-links "$RUNNER_TEMP/section-5a-wheels" --no-compile \
            --require-hashes --no-deps --only-binary=:all: \
            -r ops/section_5a_evaluator_requirements.lock

      - name: Attest isolation, dispatch and runtime for this workflow (no database)
        shell: bash
        env:
          MIGRATION_0019_EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: python -I -S -B scripts/apply_migration_0019.py --mode=attest --expected-sha="$MIGRATION_0019_EXPECTED_SHA" --wheelhouse="$RUNNER_TEMP/section-5a-wheels"

      - name: Rehearse the apply on a scratch local PostgreSQL database (no secret)
        shell: bash
        env:
          MIGRATION_0019_REHEARSAL_URL: "postgresql:///migration_0019_rehearsal?host=/var/run/postgresql"
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -X -q -v ON_ERROR_STOP=1 -c "CREATE ROLE \"$(id -un)\" LOGIN"
          sudo -u postgres psql -X -q -v ON_ERROR_STOP=1 -f - < scripts/migration_0013_rehearsal/00_supabase_like_roles.sql
          sudo -u postgres psql -X -q -v ON_ERROR_STOP=1 -v owner="$(id -un)" -f - < scripts/migration_0016_rehearsal/00_supabase_like_authenticator.sql
          sudo -u postgres createdb -O "$(id -un)" migration_0019_rehearsal
          sudo -u postgres psql -X -q -v ON_ERROR_STOP=1 -v owner="$(id -un)" -d migration_0019_rehearsal -f - < scripts/migration_0013_rehearsal/01_supabase_like_grants.sql
          sudo -u postgres psql -X -q -v ON_ERROR_STOP=1 -v owner="$(id -un)" -d migration_0019_rehearsal -f - < scripts/migration_0015_rehearsal/00_supabase_like_function_grants.sql
          cat migrations/0001_init.sql migrations/0002_news.sql migrations/0003_prediction_ledger.sql migrations/0004_prediction_outcomes.sql migrations/0005_prediction_feature_snapshots.sql migrations/0006_prediction_derivatives_snapshots.sql migrations/0007_prediction_origin.sql migrations/0008_analysis_run_details.sql migrations/0009_section_5a_evaluation_seal.sql migrations/0010_legacy_table_security.sql migrations/0011_prediction_target_provenance.sql migrations/0012_prediction_resolution_status.sql migrations/0013_automation_radar_ledger.sql migrations/0014_core_evidence_invariants.sql migrations/0015_prediction_bundle_rpc.sql migrations/0016_least_privilege_roles.sql migrations/0017_forecast_bundle_rpc.sql migrations/0018_narrow_service_role.sql > "$RUNNER_TEMP/migrations_0001_0018.sql"
          psql -X -q -v ON_ERROR_STOP=1 -d migration_0019_rehearsal -f - < "$RUNNER_TEMP/migrations_0001_0018.sql"
          psql -X -q -v ON_ERROR_STOP=1 -d migration_0019_rehearsal -f - < scripts/migration_0019_rehearsal/00_g1_resolver_login.sql
          python -I -S -B scripts/apply_migration_0019.py --mode=rehearse --wheelhouse="$RUNNER_TEMP/section-5a-wheels" --report=migration-0019-rehearsal-report.json
          psql -X -q -v ON_ERROR_STOP=1 -d migration_0019_rehearsal -f - < scripts/migration_0019_rehearsal/10_probe.sql

      - name: Run route tests under this exact runtime (no secret)
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONNOUSERSITE: "1"
        run: python -s -B -m pytest -q -p no:cacheprovider tests/scripts/test_apply_migration_0019.py tests/workflows/test_ng4_pilot_authored_workflows.py

      - name: Apply migration 0019 once (the ONLY step that receives the database secret)
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          MIGRATION_0019_EXPECTED_SHA: ${{ inputs.expected_sha }}
          MIGRATION_0019_CONFIRM: ${{ inputs.confirm }}
        run: python -I -S -B scripts/apply_migration_0019.py --mode=apply --expected-sha="$MIGRATION_0019_EXPECTED_SHA" --confirm="$MIGRATION_0019_CONFIRM" --wheelhouse="$RUNNER_TEMP/section-5a-wheels" --report=migration-0019-apply-report.json

      # The raw pre- and post-check results, on success and on refusal. Never the database URL.
      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: migration-0019-apply-report
          path: |
            migration-0019-apply-report.json
            migration-0019-rehearsal-report.json
          if-no-files-found: warn
