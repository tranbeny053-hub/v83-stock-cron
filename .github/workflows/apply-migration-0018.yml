name: Migration 0018 narrows service_role on core evidence (MANUAL DISPATCH ONLY, ONE SHOT)

# Dispatch-only. DELIBERATELY NO `schedule:`, `push:` OR `pull_request:` TRIGGER.
# - Merging this workflow is the owner's T3.
# - Dispatching it is a T4: the owner authorizes ONE dispatch, one shot, and it is never rerun.
# - It is dispatched only after the D6 production inventory is clean (owner ruling D6: timing B; run
#   37149774863, expect=before, PASS) and migrations 0016 and 0017 are applied.
# - The bulk scripts/apply_migrations.py is never used for 0018.
#
# WHAT IT DOES. scripts/apply_migration_0018.py applies exactly migrations/0018 in ONE transaction:
# - read-only pre-checks refuse unless all of these hold:
#   - the server is PostgreSQL 16 or later, and PostgREST's authenticator exists;
#   - migrations 0016 and 0017 are applied exactly: the four roles without powers, their grants,
#     schema rights and 44 policies, authenticator's switch to the writer, and both bundle functions
#     as SECURITY DEFINER of ucpe_bundle_owner with their reviewed bodies, executable by their
#     owner, the writer and service_role;
#   - the applying role holds ADMIN on ucpe_bundle_owner (or SUPERUSER) and owns every table;
#   - service_role holds exactly its pre-D6 privileges on the six core evidence tables, and D6's
#     core-write inventory finds every write surface inside the revoke set and none outside it;
#   - if service_role already holds only SELECT and EXECUTE on neither function, a second dispatch
#     changes nothing;
# - then the migration, whose bytes must equal the digest pinned in the script;
# - then read-only catalog post-checks:
#   - service_role holds exactly SELECT on the six tables, and EXECUTE on neither bundle function;
#   - D6's inventory finds no write surface at all;
#   - both functions are otherwise unchanged, so their owner and the writer still execute them;
#   - everything else is unchanged, the memberships, the four roles' grants and policies and the
#     F1/UOR grants included.
# Any refusal rolls everything back. No application row is read or written. The report names only
# API, pg_* and ucpe_* roles (the repository is public); every other role name is withheld.
#
# BEFORE THE SECRET IS HANDED TO ANY STEP, the same apply is rehearsed on a scratch local PostgreSQL.
# It is built from migrations 0001-0017 with Supabase-like roles, default privileges, PostgREST's
# authenticator, and an owner holding CREATEROLE without SUPERUSER, which creates 0016's roles. The
# apply runs once through the route, is refused a second time, and is then probed independently.
# The result's behaviour through PostgREST is proven on every pull request by
# .github/workflows/privilege-rehearsal.yml (P3-PRIV-R, D1-D4).
#
# THE SAME TRUST BOUNDARY AS THE OTHER DATABASE ROUTES:
# - exact CPython 3.13.14 and the pinned Actions;
# - CPython's bundled pip, installing lock-authenticated wheels;
# - `python -I -S -B`;
# - a dispatch verified against THIS workflow, in the owner repository, on main, at exactly
#   expected_sha.
# Inputs reach the shell ONLY through `env:`, expanded in double quotes. Every step declares
# `shell: bash`. Only the apply step receives the database secret, and only after the owner approves
# the run in the protected Environment production-db-owner (C4).
#
# CONCURRENCY. It shares the section 5A group, so no two production-database dispatch workflows of
# this repository can ever run at the same time.

"on":
  workflow_dispatch:
    inputs:
      expected_sha:
        description: REQUIRED. The full 40-character commit SHA on main that the owner reviewed
        required: true
        type: string
      confirm:
        description: REQUIRED. Exactly APPLY-MIGRATION-0018-ONCE
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: section-5a-evaluation
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    environment: production-db-owner  # C4: the owner URL lives only in this protected Environment
    timeout-minutes: 20
    steps:
      # Actions are pinned to full commit SHAs, never to movable tags.
      - name: Check out the dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: "false"

      - name: Install the exact pinned interpreter
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.13.14"
          check-latest: "false"

      - name: Install the hash-locked set with CPython's bundled pip, from authenticated wheels
        shell: bash
        # A literal block: `:all: ` in a plain YAML scalar would make the whole file invalid.
        run: |
          python -I -S -B scripts/evaluate_section_5a.py --remove-floating-installer
          bundled_pip="$(python -I -S -B scripts/evaluate_section_5a.py --bundled-pip)"
          python -I -S -B "$bundled_pip/pip" download --no-cache-dir --disable-pip-version-check \
            --require-hashes --no-deps --only-binary=:all: --dest "$RUNNER_TEMP/section-5a-wheels" \
            -r ops/section_5a_evaluator_requirements.lock
          python -I -S -B "$bundled_pip/pip" install --no-cache-dir --disable-pip-version-check \
            --no-index --find-links "$RUNNER_TEMP/section-5a-wheels" --no-compile \
            --require-hashes --no-deps --only-binary=:all: \
            -r ops/section_5a_evaluator_requirements.lock

      - name: Attest isolation, dispatch and runtime for this workflow (no database)
        shell: bash
        env:
          MIGRATION_0018_EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: python -I -S -B scripts/apply_migration_0018.py --mode=attest --expected-sha="$MIGRATION_0018_EXPECTED_SHA" --wheelhouse="$RUNNER_TEMP/section-5a-wheels"

      - name: Rehearse the apply on a scratch local PostgreSQL database (no secret)
        shell: bash
        env:
          MIGRATION_0018_REHEARSAL_URL: "postgresql:///migration_0018_rehearsal?host=/var/run/postgresql"
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -X -q -v ON_ERROR_STOP=1 -c "CREATE ROLE \"$(id -un)\" LOGIN"
          sudo -u postgres psql -X -q -v ON_ERROR_STOP=1 -f - < scripts/migration_0013_rehearsal/00_supabase_like_roles.sql
          sudo -u postgres psql -X -q -v ON_ERROR_STOP=1 -v owner="$(id -un)" -f - < scripts/migration_0016_rehearsal/00_supabase_like_authenticator.sql
          sudo -u postgres createdb -O "$(id -un)" migration_0018_rehearsal
          sudo -u postgres psql -X -q -v ON_ERROR_STOP=1 -v owner="$(id -un)" -d migration_0018_rehearsal -f - < scripts/migration_0013_rehearsal/01_supabase_like_grants.sql
          sudo -u postgres psql -X -q -v ON_ERROR_STOP=1 -v owner="$(id -un)" -d migration_0018_rehearsal -f - < scripts/migration_0015_rehearsal/00_supabase_like_function_grants.sql
          cat migrations/0001_init.sql migrations/0002_news.sql migrations/0003_prediction_ledger.sql migrations/0004_prediction_outcomes.sql migrations/0005_prediction_feature_snapshots.sql migrations/0006_prediction_derivatives_snapshots.sql migrations/0007_prediction_origin.sql migrations/0008_analysis_run_details.sql migrations/0009_section_5a_evaluation_seal.sql migrations/0010_legacy_table_security.sql migrations/0011_prediction_target_provenance.sql migrations/0012_prediction_resolution_status.sql migrations/0013_automation_radar_ledger.sql migrations/0014_core_evidence_invariants.sql migrations/0015_prediction_bundle_rpc.sql migrations/0016_least_privilege_roles.sql migrations/0017_forecast_bundle_rpc.sql > "$RUNNER_TEMP/migrations_0001_0017.sql"
          psql -X -q -v ON_ERROR_STOP=1 -d migration_0018_rehearsal -f - < "$RUNNER_TEMP/migrations_0001_0017.sql"
          python -I -S -B scripts/apply_migration_0018.py --mode=rehearse --wheelhouse="$RUNNER_TEMP/section-5a-wheels" --report=migration-0018-rehearsal-report.json
          psql -X -q -v ON_ERROR_STOP=1 -d migration_0018_rehearsal -f - < scripts/migration_0018_rehearsal/10_probe.sql

      - name: Run migration 0018's tests under this exact runtime (no secret)
        shell: bash
        env:
          # Inherited by every subprocess a test starts. No test may leave bytecode in the checkout,
          # which the apply step's isolation audit would refuse, or import user site-packages.
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONNOUSERSITE: "1"
        run: python -s -B -m pytest -q -p no:cacheprovider tests/scripts/test_apply_migration_0018.py tests/migrations/test_narrow_service_role_migration.py tests/workflows/test_apply_migration_0018_workflow.py tests/workflows/test_workflow_steps_reader.py

      - name: Apply migration 0018 once (the ONLY step that receives the database secret)
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          MIGRATION_0018_EXPECTED_SHA: ${{ inputs.expected_sha }}
          MIGRATION_0018_CONFIRM: ${{ inputs.confirm }}
        run: python -I -S -B scripts/apply_migration_0018.py --mode=apply --expected-sha="$MIGRATION_0018_EXPECTED_SHA" --confirm="$MIGRATION_0018_CONFIRM" --wheelhouse="$RUNNER_TEMP/section-5a-wheels" --report=migration-0018-apply-report.json

      # The raw pre- and post-check results, on success and on refusal. Never the database URL.
      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: migration-0018-apply-report
          path: |
            migration-0018-apply-report.json
            migration-0018-rehearsal-report.json
          if-no-files-found: warn
