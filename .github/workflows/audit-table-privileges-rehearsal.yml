name: Older-table privilege audit rehearsal (scratch PostgreSQL, no secrets)

# Proves, BEFORE the audit route can merge, that every catalog query runs on a real PostgreSQL and
# that the assessment reads the rehearsal fixtures correctly. It builds a scratch database on the
# runner from the real migrations, connects as a role with NO privilege on any audited table, and
# runs scripts/audit_table_privileges.py --mode=rehearse. It references no secret and touches no
# real database. The job is named `test` so the owner-authorized merge procedure waits for it.

"on":
  pull_request:
    paths:
      - scripts/audit_table_privileges.py
      - scripts/audit_rehearsal/**
      - .github/workflows/audit-table-privileges.yml
      - .github/workflows/audit-table-privileges-rehearsal.yml
      - migrations/0001_init.sql
      - migrations/0002_news.sql
      - migrations/0003_prediction_ledger.sql
      - migrations/0004_prediction_outcomes.sql
      - migrations/0007_prediction_origin.sql

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: "false"

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.11"

      - name: Install the project dependencies
        shell: bash
        run: python -m pip install -r requirements.txt

      - name: Rehearse the audit on a scratch local PostgreSQL built from the migrations
        shell: bash
        env:
          AUDIT_REHEARSAL_URL: "postgresql:///audit_rehearsal?host=/var/run/postgresql"
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres createdb audit_rehearsal
          sudo -u postgres psql -X -q -v ON_ERROR_STOP=1 -d audit_rehearsal -c "CREATE ROLE \"$(id -un)\" LOGIN"
          cat scripts/audit_rehearsal/00_supabase_like_roles.sql migrations/0001_init.sql migrations/0002_news.sql migrations/0003_prediction_ledger.sql migrations/0004_prediction_outcomes.sql migrations/0007_prediction_origin.sql scripts/audit_rehearsal/90_variations.sql > "$RUNNER_TEMP/audit_rehearsal.sql"
          sudo -u postgres psql -X -q -v ON_ERROR_STOP=1 -d audit_rehearsal -f - < "$RUNNER_TEMP/audit_rehearsal.sql"
          PYTHONPATH=src python scripts/audit_table_privileges.py --mode=rehearse --report=audit-rehearsal-report.json

      - name: Upload the rehearsal report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: audit-rehearsal-report
          path: audit-rehearsal-report.json
          if-no-files-found: warn
