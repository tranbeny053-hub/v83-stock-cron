name: Older-table privilege audit (MANUAL DISPATCH ONLY, READ ONLY)

# DELIBERATELY NO `schedule:` OR `push:` TRIGGER. Owner ruling 2026-09-16: read-only metadata only,
# for the tables migrations 0001-0004 and 0007 shape: RLS, grants to PUBLIC/anon/authenticated/
# service_role, policies, ownership and schema exposure. No application-row read, no mutation.
#
# WHAT IT DOES. scripts/audit_table_privileges.py reads PostgreSQL catalogs only, in ONE transaction
# made READ ONLY by its first statement, and rolls it back. No application table is ever named in a
# query. Before any step holds the secret, the same audit is rehearsed against a scratch local
# PostgreSQL built from the real migrations, connected as a role with NO privilege on any audited
# table, which proves the audit reads catalogs only.
#
# THE SAME TRUST BOUNDARY AS THE OTHER DATABASE ROUTES: exact CPython 3.13.14, pinned Actions,
# CPython's bundled pip installing lock-authenticated wheels, `python -I -S -B`, and a dispatch
# verified against THIS workflow in the owner repository, on main, at exactly expected_sha. Inputs
# reach the shell ONLY through `env:`, expanded in double quotes. Every step declares `shell: bash`.
# Only the audit step receives the database secret.
#
# CONCURRENCY. It shares the section 5A group, so no two production-database dispatch workflows of
# this repository can ever run at the same time.

"on":
  workflow_dispatch:
    inputs:
      expected_sha:
        description: REQUIRED. The full 40-character commit SHA on main that the owner reviewed
        required: true
        type: string
      confirm:
        description: REQUIRED. Exactly READ-ONLY-AUDIT-OLDER-TABLES-ONCE
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: section-5a-evaluation
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Actions are pinned to full commit SHAs, never to movable tags.
      - name: Check out the dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: "false"

      - name: Install the exact pinned interpreter
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.13.14"
          check-latest: "false"

      - name: Install the hash-locked set with CPython's bundled pip, from authenticated wheels
        shell: bash
        # A literal block: `:all: ` in a plain YAML scalar would make the whole file invalid.
        run: |
          python -I -S -B scripts/evaluate_section_5a.py --remove-floating-installer
          bundled_pip="$(python -I -S -B scripts/evaluate_section_5a.py --bundled-pip)"
          python -I -S -B "$bundled_pip/pip" download --no-cache-dir --disable-pip-version-check \
            --require-hashes --no-deps --only-binary=:all: --dest "$RUNNER_TEMP/section-5a-wheels" \
            -r ops/section_5a_evaluator_requirements.lock
          python -I -S -B "$bundled_pip/pip" install --no-cache-dir --disable-pip-version-check \
            --no-index --find-links "$RUNNER_TEMP/section-5a-wheels" --no-compile \
            --require-hashes --no-deps --only-binary=:all: \
            -r ops/section_5a_evaluator_requirements.lock

      - name: Attest isolation, dispatch and runtime for this workflow (no database)
        shell: bash
        env:
          AUDIT_EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: python -I -S -B scripts/audit_table_privileges.py --mode=attest --expected-sha="$AUDIT_EXPECTED_SHA" --wheelhouse="$RUNNER_TEMP/section-5a-wheels"

      - name: Rehearse the audit on a scratch local PostgreSQL built from the migrations (no secret)
        shell: bash
        env:
          AUDIT_REHEARSAL_URL: "postgresql:///audit_rehearsal?host=/var/run/postgresql"
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres createdb audit_rehearsal
          sudo -u postgres psql -X -q -v ON_ERROR_STOP=1 -d audit_rehearsal -c "CREATE ROLE \"$(id -un)\" LOGIN"
          cat scripts/audit_rehearsal/00_supabase_like_roles.sql migrations/0001_init.sql migrations/0002_news.sql migrations/0003_prediction_ledger.sql migrations/0004_prediction_outcomes.sql migrations/0007_prediction_origin.sql scripts/audit_rehearsal/90_variations.sql > "$RUNNER_TEMP/audit_rehearsal.sql"
          sudo -u postgres psql -X -q -v ON_ERROR_STOP=1 -d audit_rehearsal -f - < "$RUNNER_TEMP/audit_rehearsal.sql"
          python -I -S -B scripts/audit_table_privileges.py --mode=rehearse --wheelhouse="$RUNNER_TEMP/section-5a-wheels" --report=audit-rehearsal-report.json

      - name: Run the audit's tests under this exact runtime (no secret)
        shell: bash
        env:
          # Inherited by every subprocess a test starts. No test may leave bytecode in the checkout,
          # which the audit step's isolation check would refuse, or import user site-packages.
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONNOUSERSITE: "1"
        run: python -s -B -m pytest -q -p no:cacheprovider tests/scripts/test_audit_table_privileges.py tests/workflows/test_audit_table_privileges_workflow.py tests/workflows/test_workflow_steps_reader.py

      - name: Audit the older tables once, read only (the ONLY step that receives the database secret)
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AUDIT_EXPECTED_SHA: ${{ inputs.expected_sha }}
          AUDIT_CONFIRM: ${{ inputs.confirm }}
        run: python -I -S -B scripts/audit_table_privileges.py --mode=audit --expected-sha="$AUDIT_EXPECTED_SHA" --confirm="$AUDIT_CONFIRM" --wheelhouse="$RUNNER_TEMP/section-5a-wheels" --report=older-table-privilege-audit.json

      # The raw catalog rows and the assessment, on success and on refusal. Never the database URL.
      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: older-table-privilege-audit
          path: |
            older-table-privilege-audit.json
            audit-rehearsal-report.json
          if-no-files-found: warn
