name: OOS pair evidence (manual only)

"on":
  workflow_dispatch:
    inputs:
      dry_run:
        description: Keep the collector read/write inert
        required: true
        type: boolean
        default: true
      max_occasions:
        description: Maximum due occasions attempted in MATRIX order
        required: true
        type: number
        default: 6

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run bounded collector
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          UCPE_OOS_PAIR_EVIDENCE_ENABLED: ${{ inputs.dry_run == false && 'true' || 'false' }}
        run: >-
          PYTHONPATH=src python scripts/collect_oos_pair_evidence.py
          --dry-run ${{ inputs.dry_run }}
          --max-occasions ${{ inputs.max_occasions }}
          --confirm-write ${{ inputs.dry_run == false && 'WRITE-OOS-PAIR-EVIDENCE' || 'DRY-RUN' }}
