name: Migration 0008 durable Detail (MANUAL DISPATCH ONLY, ONE SHOT)

# DELIBERATELY NO `schedule:` OR `push:` TRIGGER. Applying migration 0008 is a T4 action. The owner
# authorizes ONE dispatch, and it is never rerun.
#
# WHAT IT DOES. scripts/apply_migration_0008.py applies exactly migrations/0008 in ONE transaction:
# - read-only pre-checks refuse if any object of 0008's names already exists in any schema, if the
#   tables the application joins are missing, or if the Supabase API roles are missing, so a
#   second dispatch changes nothing;
# - then the migration, whose bytes must equal the digest pinned in the script;
# - then read-only post-checks: columns, the one primary key, both indexes, row-level security, no
#   privilege for PUBLIC, anon or authenticated, exactly SELECT, INSERT and UPDATE for
#   service_role, ownership, zero rows, and the section 5A seal untouched.
# Any refusal rolls everything back.
#
# THE SAME TRUST BOUNDARY AS THE SECTION 5A ROUTES (pre-registration Addenda 5-7):
# - exact CPython 3.13.14 and the pinned Actions;
# - CPython's bundled pip, installing lock-authenticated wheels;
# - `python -I -S -B`;
# - a dispatch verified against THIS workflow, on main, at exactly expected_sha.
# Inputs reach the shell ONLY through `env:`, expanded in double quotes. Every step declares
# `shell: bash`. Only the apply step receives the database secret.
#
# CONCURRENCY. It shares the section 5A group, so no two production-database dispatch workflows of
# this repository can ever run at the same time.

"on":
  workflow_dispatch:
    inputs:
      expected_sha:
        description: REQUIRED. The full 40-character commit SHA on main that the owner reviewed
        required: true
        type: string
      confirm:
        description: REQUIRED. Exactly APPLY-MIGRATION-0008-ONCE
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: section-5a-evaluation
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Actions are pinned to full commit SHAs, never to movable tags.
      - name: Check out the dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: "false"

      - name: Install the exact pinned interpreter
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.13.14"
          check-latest: "false"

      - name: Install the hash-locked set with CPython's bundled pip, from authenticated wheels
        shell: bash
        # A literal block: `:all: ` in a plain YAML scalar would make the whole file invalid.
        run: |
          python -I -S -B scripts/evaluate_section_5a.py --remove-floating-installer
          bundled_pip="$(python -I -S -B scripts/evaluate_section_5a.py --bundled-pip)"
          python -I -S -B "$bundled_pip/pip" download --no-cache-dir --disable-pip-version-check \
            --require-hashes --no-deps --only-binary=:all: --dest "$RUNNER_TEMP/section-5a-wheels" \
            -r ops/section_5a_evaluator_requirements.lock
          python -I -S -B "$bundled_pip/pip" install --no-cache-dir --disable-pip-version-check \
            --no-index --find-links "$RUNNER_TEMP/section-5a-wheels" --no-compile \
            --require-hashes --no-deps --only-binary=:all: \
            -r ops/section_5a_evaluator_requirements.lock

      - name: Attest isolation, dispatch and runtime for this workflow (no database)
        shell: bash
        env:
          MIGRATION_0008_EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: python -I -S -B scripts/apply_migration_0008.py --mode=attest --expected-sha="$MIGRATION_0008_EXPECTED_SHA" --wheelhouse="$RUNNER_TEMP/section-5a-wheels"

      - name: Run migration 0008's tests under this exact runtime (no secret)
        shell: bash
        env:
          # Inherited by every subprocess a test starts. No test may leave bytecode in the checkout,
          # which the apply step's isolation audit would refuse, or import user site-packages.
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONNOUSERSITE: "1"
        run: python -s -B -m pytest -q -p no:cacheprovider tests/scripts/test_apply_migration_0008.py tests/migrations/test_analysis_run_details_migration.py tests/workflows/test_apply_migration_0008_workflow.py tests/workflows/test_workflow_steps_reader.py

      - name: Apply migration 0008 once (the ONLY step that receives the database secret)
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          MIGRATION_0008_EXPECTED_SHA: ${{ inputs.expected_sha }}
          MIGRATION_0008_CONFIRM: ${{ inputs.confirm }}
        run: python -I -S -B scripts/apply_migration_0008.py --mode=apply --expected-sha="$MIGRATION_0008_EXPECTED_SHA" --confirm="$MIGRATION_0008_CONFIRM" --wheelhouse="$RUNNER_TEMP/section-5a-wheels" --report=migration-0008-apply-report.json

      # The raw pre- and post-check results, on success and on refusal. Never the database URL.
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: migration-0008-apply-report
          path: migration-0008-apply-report.json
          if-no-files-found: warn
