name: CI

on:
  push:
    branches:
      - main
      - codex/**
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Fetch pinned production commit
        run: pin_sha="$(python -c 'import json; print(json.load(open("ops/hf_runtime_baseline.json")).get("hf_main_sha"))')"; git fetch --depth=1 origin "$pin_sha"
      - run: python -m pip install -r requirements.txt
      - run: ruff check src tests scripts
      - run: PYTHONPATH=src python -m pytest
      - run: PYTHONPATH=src python scripts/validate_schemas.py
      - run: PYTHONPATH=src python scripts/manual_smoke.py
      - run: python scripts/check_no_forbidden_scope.py
      - run: python scripts/check_no_full_article_body.py
      - run: python scripts/check_no_secrets.py
