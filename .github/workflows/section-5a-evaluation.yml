name: Section 5A evaluation (MANUAL DISPATCH ONLY)

# DELIBERATELY NO `schedule:` TRIGGER.
# A cron here could consume the one-look holdout unattended. The evaluation is run once,
# by hand, under owner authorization. See V1_QUANT_CONTRACT.md §5A.9 and
# docs/SECTION_5A_EVALUATION_PREREGISTRATION.md §1-§3 and Addendum 5.
#
# HOW INPUTS REACH THE SHELL (V808-F1). Never as `${{ }}` inside `run:`: GitHub pastes an
# expression into the script text before bash parses it, so a quote in an input became a command.
# Inputs are passed ONLY through `env:` and expanded in double quotes, where bash never re-parses
# them. Every step declares `shell: bash`, which is the only invocation with pipefail (V808-R6).
#
# ORDER IS THE SAFETY PROPERTY. Exact interpreter, then hash-locked dependencies, then the
# attestation, then the evaluator's own tests under that exact runtime. Only the last step receives
# the database secret.
#
# The attestation covers isolation, pin, dispatch (main, expected_sha) and runtime.
#
# ISOLATED START-UP (owner ruling G1=A, V809-F1). The evaluator only ever runs as `python -I -S -B`.
# Before any module beyond the standard library loads, it verifies its import surface and refuses
# untracked code, `.pth` files, duplicates, symlinks and shadows. So no step may leave bytecode or
# code behind: every Python step runs with -B, and pip installs with --no-compile.
#
# THE TRUST BOUNDARY (owner ruling J1=B, V810). Trusted, and nothing else:
# - the exact CPython 3.13.14 installed by the pinned setup-python;
# - the pinned Actions;
# - the pip wheel CPython bundles in ensurepip/_bundled.
# The runner's floating pip, which setup-python reinstalls from the index unverified, is deleted
# unrun. Wheels are downloaded by CPython's bundled pip and authenticated against the hash lock.
# Installed importable bytes are attested against the RECORD inside each authenticated wheel, never
# against the RECORD pip writes beside them. No unverified code runs after attestation.
# Pre-registration Addendum 7.

"on":
  workflow_dispatch:
    inputs:
      mode:
        description: readiness is repeatable and safe; consume takes THE ONE LOOK
        required: true
        type: choice
        default: readiness
        options:
          - readiness
          - consume
          # V807-R4: recovery from the DURABLE seal needs the database secret, which exists only
          # here. It reads the captured evidence, never the predictions, so it is not a second look.
          - recompute
      expected_sha:
        description: REQUIRED. The full 40-character commit SHA on main that the owner reviewed
        required: true
        type: string
      confirm:
        description: required for consume; exactly CONSUME-SECTION-5A-ONE-LOOK
        required: false
        type: string
        default: ""
      # Addendum 10 (§2.6 safety change): consumption refuses, before claiming or reading anything,
      # unless the population it is about to evaluate is exactly the one readiness measured.
      expected_population_id:
        description: required for consume; the FULL decision_population_id from the readiness run on this commit
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: section-5a-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Actions are pinned to full commit SHAs, never to movable tags.
      - name: Check out the dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: "false"

      - name: Install the exact pinned interpreter
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.13.14"
          check-latest: "false"

      - name: Install the hash-locked set with CPython's bundled pip, from authenticated wheels
        shell: bash
        # A literal block: `:all: ` in a plain YAML scalar would make the whole file invalid.
        run: |
          python -I -S -B scripts/evaluate_section_5a.py --remove-floating-installer
          bundled_pip="$(python -I -S -B scripts/evaluate_section_5a.py --bundled-pip)"
          python -I -S -B "$bundled_pip/pip" download --no-cache-dir --disable-pip-version-check \
            --require-hashes --no-deps --only-binary=:all: --dest "$RUNNER_TEMP/section-5a-wheels" \
            -r ops/section_5a_evaluator_requirements.lock
          python -I -S -B "$bundled_pip/pip" install --no-cache-dir --disable-pip-version-check \
            --no-index --find-links "$RUNNER_TEMP/section-5a-wheels" --no-compile \
            --require-hashes --no-deps --only-binary=:all: \
            -r ops/section_5a_evaluator_requirements.lock

      - name: Attest isolation, pin, dispatch and runtime (main, expected_sha, interpreter, lock)
        shell: bash
        env:
          SECTION_5A_EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: python -I -S -B scripts/evaluate_section_5a.py --mode=attest --expected-sha="$SECTION_5A_EXPECTED_SHA" --wheelhouse="$RUNNER_TEMP/section-5a-wheels"

      - name: Run the evaluator's tests under this exact runtime (no secret)
        shell: bash
        env:
          # Inherited by every subprocess a test starts. No test may leave bytecode in the checkout,
          # which the evaluation step's isolation audit would refuse, or import user site-packages.
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONNOUSERSITE: "1"
        run: python -s -B -m pytest -q -p no:cacheprovider tests/oos/evaluation tests/persistence/test_section_5a_seal_sql.py tests/migrations/test_section_5a_seal_migration.py tests/scripts/test_evaluate_section_5a.py tests/workflows/test_section_5a_evaluation_workflow_contract.py tests/workflows/test_section_5a_workflow_boundary.py tests/workflows/test_workflow_steps_reader.py tests/utils/test_canonical_json.py

      - name: Run the evaluation (the ONLY step that receives the database secret)
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SECTION_5A_MODE: ${{ inputs.mode }}
          SECTION_5A_EXPECTED_SHA: ${{ inputs.expected_sha }}
          SECTION_5A_CONFIRM: ${{ inputs.confirm }}
          SECTION_5A_EXPECTED_POPULATION_ID: ${{ inputs.expected_population_id }}
        run: python -I -S -B scripts/evaluate_section_5a.py --mode="$SECTION_5A_MODE" --expected-sha="$SECTION_5A_EXPECTED_SHA" --confirm="$SECTION_5A_CONFIRM" --expected-population-id="$SECTION_5A_EXPECTED_POPULATION_ID" --wheelhouse="$RUNNER_TEMP/section-5a-wheels" --artifact-dir=.work/section_5a --report=section-5a-report.json

      # SECONDARY ONLY. The durable one-shot seal and the raw capture live in Postgres
      # (migrations/0009). This upload is convenience and audit trail; it is never the
      # authority, because a fresh runner per dispatch makes a filesystem seal useless.
      - name: Upload the artifact (secondary; the durable seal is in Postgres)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: "section-5a-${{ inputs.mode }}"
          path: |
            section-5a-report.json
            .work/section_5a/
          if-no-files-found: warn
