name: UCPE Derivatives Registry Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: derivatives-registry-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Binance registry diagnostic
        env:
          PYTHONPATH: src
        run: |
          PYTHONPATH=src python3 scripts/diagnose_binance_registry.py
