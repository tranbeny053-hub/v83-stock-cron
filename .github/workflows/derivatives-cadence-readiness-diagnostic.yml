name: Derivatives Cadence Readiness Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: derivatives-cadence-readiness-diagnostic
  cancel-in-progress: false

jobs:
  measure-okx-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run write-free OKX cadence readiness diagnostic
        env:
          PYTHONPATH: src
        run: |
          PYTHONPATH=src python3 scripts/measure_okx_cadence_readiness.py \
            --source-commit-sha "${GITHUB_SHA}" \
            --runner-identity-class github-hosted-ubuntu
