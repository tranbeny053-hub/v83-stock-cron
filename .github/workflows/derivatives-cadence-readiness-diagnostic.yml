name: Derivatives Cadence Readiness Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: derivatives-cadence-readiness-diagnostic
  cancel-in-progress: false

jobs:
  measure-okx-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run write-free OKX cadence readiness diagnostic
        env:
          PYTHONPATH: src
        run: |
          PYTHONPATH=src python3 scripts/measure_okx_cadence_readiness.py \
            --source-commit-sha "${GITHUB_SHA}" \
            --runner-identity-class github-hosted-ubuntu
