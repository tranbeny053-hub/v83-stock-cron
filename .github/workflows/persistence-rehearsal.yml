name: Persistence fault rehearsal (scratch PostgreSQL, no secrets)

# PERS-0 (plan §22 item 7; the §23 Persistence criteria) and B9 (plan §8.1). On every pull request
# that touches a writer, migrations or this rehearsal, it measures both persistence writers under
# injected faults on a real PostgreSQL built from every migration (0001-0015):
# - a write that fails after the prediction row, a response lost after commit;
# - same-content and conflicting retries;
# - the circuit after a failure.
# Route "postgres" is the direct-Postgres writer, not production's: its verdicts are data.
# Route "rest_rpc" is production's REST writer and its B9 bundle, migration 0015's RPC, called
# exactly as PostgREST calls it (scripts/persistence_rehearsal/postgrest_emulator.py), plus the
# function's privileges and refusals. --require-route rest_rpc makes every one of those a gate:
# the job fails unless C1a, C1b, C2, C3 and C4 all PASS on it. It references no secret and touches
# no real database.

"on":
  pull_request:
    paths:
      - scripts/persistence_rehearsal/**
      - src/crypto_probability_engine/persistence/**
      - src/crypto_probability_engine/api/analysis_service.py
      - migrations/**
      - .github/workflows/persistence-rehearsal.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Actions are pinned to full commit SHAs, never to movable tags.
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: "false"

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.11"

      - name: Install the project dependencies
        shell: bash
        run: python -m pip install -r requirements.txt

      - name: Rehearse both writers under injected faults on scratch local PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl start postgresql.service
          sudo -u postgres psql -X -q -v ON_ERROR_STOP=1 -c "CREATE ROLE \"$(id -un)\" LOGIN"
          sudo -u postgres psql -X -q -v ON_ERROR_STOP=1 -f - < scripts/migration_0013_rehearsal/00_supabase_like_roles.sql
          sudo -u postgres createdb -O "$(id -un)" persistence_rehearsal
          sudo -u postgres psql -X -q -v ON_ERROR_STOP=1 -v owner="$(id -un)" -d persistence_rehearsal -f - < scripts/migration_0013_rehearsal/01_supabase_like_grants.sql
          sudo -u postgres psql -X -q -v ON_ERROR_STOP=1 -v owner="$(id -un)" -d persistence_rehearsal -f - < scripts/migration_0015_rehearsal/00_supabase_like_function_grants.sql
          cat migrations/0001_init.sql migrations/0002_news.sql migrations/0003_prediction_ledger.sql migrations/0004_prediction_outcomes.sql migrations/0005_prediction_feature_snapshots.sql migrations/0006_prediction_derivatives_snapshots.sql migrations/0007_prediction_origin.sql migrations/0008_analysis_run_details.sql migrations/0009_section_5a_evaluation_seal.sql migrations/0010_legacy_table_security.sql migrations/0011_prediction_target_provenance.sql migrations/0012_prediction_resolution_status.sql migrations/0013_automation_radar_ledger.sql migrations/0014_core_evidence_invariants.sql migrations/0015_prediction_bundle_rpc.sql > "$RUNNER_TEMP/migrations_0001_0015.sql"
          psql -X -q -v ON_ERROR_STOP=1 -d persistence_rehearsal -f - < "$RUNNER_TEMP/migrations_0001_0015.sql"
          PERSISTENCE_REHEARSAL_URL="postgresql:///persistence_rehearsal?host=/var/run/postgresql" PYTHONPATH=src python scripts/persistence_rehearsal/fault_injection.py --report=persistence-fault-rehearsal-report.json --require-route rest_rpc

      - name: Upload the rehearsal report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: persistence-fault-rehearsal-report
          path: persistence-fault-rehearsal-report.json
          if-no-files-found: warn
